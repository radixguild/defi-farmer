name: secret-scan

# Secret-scanning guardrail. Scans the FULL git history on every PR and every
# push to main. Config lives in .gitleaks.toml (baseline verified
# clean-of-real-secrets 2026-09-08 — see that file's header for the one
# allowlisted test fixture). Mirrors the approach the Guild repo
# (radixguild/guild, .github/workflows/secret-scan.yml) uses, adapted to this
# repo's simpler trigger convention (see ci.yml: push + pull_request, both
# scoped to `main` — this repo has no open, long-lived stacked-PR chains, so
# it does not need the Guild's unscoped pull_request trigger, which exists
# there to cover a stacked PR's base branch losing coverage once its own PR
# closes).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Zero cost unless invoked — lets an operator re-run a scan on demand (e.g.
  # against a long-lived branch between pushes) without waiting for a trigger.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    # ubuntu-slim (1 vCPU): this job does ~10 s of work and private-repo minutes
    # bill PER JOB, ROUNDED UP, so the runner RATE is the only lever left —
    # $0.002/min here vs $0.006 on ubuntu-latest (rationale and measurements:
    # radixguild/guild .github/workflows/test.yml). slim has no sudo, hence the
    # user-dir install below.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    env:
      # Pinned + checksum-verified below, not a floating tag. Bump in lockstep
      # with the local install and this file's documented baseline version.
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, read from the v8.30.1 release's
      # checksums file on 2026-10-06 and re-verified against a fresh download.
      # Bump TOGETHER with GITLEAKS_VERSION.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history — gitleaks scans every commit, not just the diff.
          fetch-depth: 0

      - name: refuse to scan a shallow clone (fail closed)
        # --log-opts=HEAD below scopes gitleaks to commits reachable from HEAD
        # instead of gitleaks' default of every ref the checkout pulled down
        # (see the scan step). That is only equivalent to a full history scan
        # because `fetch-depth: 0` above makes HEAD's own history complete. If
        # depth were ever shallowed, gitleaks would report "0 leaks" having
        # examined almost nothing, and the job would go green having proven
        # nothing. This step makes that failure loud instead of silent, and
        # runs it BEFORE installing gitleaks so a shallow checkout fails in
        # seconds rather than after a download.
        run: |
          set -euo pipefail
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::This checkout is SHALLOW. gitleaks git --log-opts=HEAD only sees commits present locally, so a shallow clone reports a false '0 leaks' instead of failing. Fix: restore 'fetch-depth: 0' on the checkout step above. Refusing to run the scan." >&2
            exit 1
          fi

      - name: install gitleaks (pinned, checksum-verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          # First assertion: the digest pinned in THIS file. A checksums file fetched
          # from the same release as the binary proves the download was not corrupted,
          # not that the asset is the one we reviewed — a replaced asset ships a
          # matching checksums.txt. The pin is what a reviewer can diff.
          echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -
          # Second assertion: the release's own checksums file still agrees.
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -F "$asset" checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          mkdir -p "$RUNNER_TEMP/bin" && mv gitleaks "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: scan git history
        # Exits non-zero if any secret is found (default exit code 1).
        # --redact keeps real secret values out of the public CI logs.
        # --log-opts=HEAD scopes the walk to commits reachable from HEAD —
        # every commit that could reach main is still scanned in full, every
        # time. What it stops scanning is UNMERGED SIBLING branches, which
        # gitleaks' default (every ref fetch-depth: 0 pulled down) otherwise
        # walks too — with stale feature branches around, a leak on any one of
        # them would otherwise fail every unrelated open PR at once, none of
        # which contain the offending line. Preceded by the
        # shallow-clone guard above, which is what keeps this scoping from
        # ever running unchecked against a truncated history.
        #
        # CAVEAT, deliberately left open: if this repo is ever made public by
        # flipping visibility with all refs intact — rather than a fresh
        # squashed re-cut — unmerged branches become public too and this
        # scoping would not have covered them. Sweep all refs by hand first:
        #   gitleaks git -c .gitleaks.toml   (no --log-opts)
        run: gitleaks git --no-banner --redact -c .gitleaks.toml --log-opts=HEAD
